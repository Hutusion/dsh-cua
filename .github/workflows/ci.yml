name: ci

# What this covers, and what it deliberately does not.
#
# The full verification suite (tests/verify-coexistence.py, tests/verify-p0-fixes.py)
# needs a REAL interactive desktop: it creates a window and addresses it through UIA, and
# the coexistence checks synthesise human input with a real cursor move. A GitHub-hosted
# runner has no interactive desktop session, so those scripts cannot run here and are run
# by hand on a Windows machine with a desktop.
#
# What IS covered here is everything that needs no desktop: that the package installs and
# its entry point resolves, that every module imports, that no ctypes name is taken from a
# module that does not define it (how 0.3.2 shipped a tool that raised on every call), that
# the diff/escaping logic still behaves (the P0-3 regression), that the arbiter's decision
# logic is intact, and that a set of behaviors an earlier release dropped are still present.
# That last group is the reason this file exists — those regressions shipped precisely because
# nothing tested them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop-free:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares >=3.10; 3.10 is the floor, 3.12 is what it is developed on.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package (validates pyproject, deps, entry point)
        run: |
          python -m pip install --upgrade pip
          # ".[test]", not "." — tests/check-workflow-shell.py parses the workflow YAML and
          # therefore needs PyYAML, which pyproject declares as the `test` extra.
          #
          # Run #5 failed because that import was undeclared: it resolved on a machine that
          # happened to have PyYAML and died on the runner in 0 seconds with no output.
          # Installing the extra is what makes the runner's dependency set match the one
          # the tests are written against.
          python -m pip install ".[test]"

      - name: Entry point resolves
        run: |
          python -c "import importlib.metadata as m; print('dsh-cua', m.version('dsh-cua'))"
          python -c "from dsh_cua.server import main; assert callable(main); print('main() ok')"
          # The console script must exist on PATH; --help would start the stdio server,
          # so only its presence is asserted.
          python -c "import shutil,sys; p=shutil.which('dsh-cua-server'); sys.exit(0 if p else 'dsh-cua-server not on PATH')"

      - name: Byte-compile every module
        run: python -m compileall -q src

      - name: Environment facts (diagnostic; never fails the job)
        shell: pwsh
        run: |
          # Every fact a runner-only failure needs to be explained, published where it can
          # be read from outside: the job summary is rendered on the public run page,
          # whereas the job log endpoint needs authentication (measured: 403 unauthenticated).
          $lines = @(
            "### environment facts",
            "",
            "| fact | value |",
            "| --- | --- |",
            "| python -V | $((python -V 2>&1) -join ' ') |",
            "| sys.executable | $(python -c 'import sys; print(sys.executable)') |",
            "| PyYAML module | $(python -c 'import importlib.util as u; s=u.find_spec("yaml"); print(s.origin if s else "MISSING")') |",
            "| pwsh version | $($PSVersionTable.PSVersion) |",
            "| pwsh path | $((Get-Command pwsh -ErrorAction SilentlyContinue).Source) |",
            "| runner image | $env:RUNNER_OS / $env:ImageOS |"
          )
          $lines | ForEach-Object { Write-Output $_ }
          if ($env:GITHUB_STEP_SUMMARY) {
            $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Workflow shell blocks parse
        run: python tests/check-workflow-shell.py

      - name: No ctypes name is taken from the module that lacks it
        run: python tests/check-ctypes-names.py

      # linux-handshake.py SKIPs on Windows, so this is the only place its reply classifier can
      # be guarded on the platform it is written on. It runs the classifier against payloads
      # recorded from real runs, including the 0.3.2 defect.
      - name: The handshake's reply classifier still judges recorded payloads correctly
        run: python tests/check-handshake-classifier.py

      - name: Desktop-free verification suite
        shell: pwsh
        run: |
          # Run the suite and publish its output on failure, through the two channels that
          # need no token: the job summary (full text, on the public run page) and check
          # annotations (via the public API). The job log itself is 403 unauthenticated, so
          # without this a red run is opaque from outside.
          #
          # Note on exit codes: GitHub runs a `shell: pwsh` step as
          # `pwsh -command ". '<temp>.ps1'"`, and in that shape every non-zero exit surfaces
          # as 1 (measured 2026-09-25 on PowerShell 7.6.6: exit 2 / exit 3 / cmd /c exit 5 /
          # sys.exit(7) all became 1, while -File kept the code). So `$code` below cannot be
          # trusted as a diagnosis — the output is the diagnosis, which is why it is published.
          python tests/ci-desktop-free.py *> ci-output.txt
          $code = $LASTEXITCODE
          Get-Content ci-output.txt | ForEach-Object { Write-Output $_ }

          if ($code -ne 0) {
            if ($env:GITHUB_STEP_SUMMARY) {
              "### ci-desktop-free: FAIL" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              "``````text" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              Get-Content ci-output.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              "``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            }
            $flat = (Get-Content ci-output.txt -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            $i = 0
            foreach ($m in [regex]::Matches($flat, '.{1,20000}')) {
              Write-Output "::error title=ci-output-$i::$($m.Value)"
              $i++
            }
            Write-Output ("::error title=ci-desktop-free::{0} annotation chunk(s) above; exit code {1}" -f $i, $code)
          }
          exit $code

  # The regression test for the guard in src/dsh_cua/server.py.
  #
  # 0.3.0 raised RuntimeError while importing the package off Windows, so the server could not
  # start there at all. That blindfolds anything which enumerates a server by running it and
  # reading `tools/list` — Glama builds and runs every server inside a Linux sandbox before a
  # listing becomes discoverable, and withholds the listing when that build or run fails.
  # 0.3.1 guards the Win32 imports instead, and this job is what keeps that true. It can only
  # run here: on Windows the Win32 modules import normally and the guard is never exercised.
  #
  # Each step declares `shell: bash` explicitly. That is also why they appear as `skip` in the
  # "Workflow shell blocks parse" step above — that checker validates PowerShell and correctly
  # refuses to guess that a bash block is PowerShell.
  linux-introspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package (validates the sys_platform markers)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          # The Windows-only dependencies must NOT be installed here; the test asserts it
          # again from the installed set, but failing early says which layer broke.
          python -c "import importlib.util as u; import sys; \
            bad=[m for m in ('comtypes','pywinauto') if u.find_spec(m)]; \
            sys.exit('installed on Linux: %s' % bad if bad else 0)"

      - name: Server starts and advertises every tool (off Windows)
        shell: bash
        run: |
          # The job-log endpoint is 403 unauthenticated, so a red run is otherwise opaque from
          # outside — the same lesson the Windows job learned. Publish the output through the
          # two channels that need no token: check annotations (readable via the public API;
          # measured working 2026-09-25) and the job summary (rendered on the public run page).
          set +e
          python tests/linux-handshake.py 2>&1 | tee /tmp/linux-handshake.log
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -ne 0 ]; then
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              {
                echo "### linux-handshake: FAIL (exit $code)"
                echo '```text'
                cat /tmp/linux-handshake.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            python - <<'PY'
          text = open('/tmp/linux-handshake.log', encoding='utf-8', errors='replace').read()
          flat = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for i in range(0, max(len(flat), 1), 20000):
              print(f"::error title=linux-handshake-{i // 20000}::{flat[i:i + 20000]}")
          PY
          else
            # A green run should still say what it verified, not merely that it exited 0.
            echo "::notice title=linux-handshake::$(grep -E '^(imports ok|serverInfo|tools|tool call)' /tmp/linux-handshake.log | tr '\n' ' ')"
          fi
          exit "$code"
