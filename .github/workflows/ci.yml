name: ci

# What this covers, and what it deliberately does not.
#
# The full verification suite (tests/verify-coexistence.py, tests/verify-p0-fixes.py)
# needs a REAL interactive desktop: it creates a window and addresses it through UIA, and
# the coexistence checks synthesise human input with a real cursor move. A GitHub-hosted
# runner has no interactive desktop session, so those scripts cannot run here and are run
# by hand on a Windows machine with a desktop.
#
# What IS covered here is everything that needs no desktop: that the package installs and
# its entry point resolves, that every module imports, that the diff/escaping logic still
# behaves (the P0-3 regression), that the arbiter's decision logic is intact, and that a
# set of behaviors an earlier release dropped are still present. That last group is the
# reason this file exists — those regressions shipped precisely because nothing tested
# them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop-free:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares >=3.10; 3.10 is the floor, 3.12 is what it is developed on.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package (validates pyproject, deps, entry point)
        run: |
          python -m pip install --upgrade pip
          # ".[test]", not "." — tests/check-workflow-shell.py parses the workflow YAML and
          # therefore needs PyYAML, which pyproject declares as the `test` extra.
          #
          # Run #5 failed because that import was undeclared: it resolved on a machine that
          # happened to have PyYAML and died on the runner in 0 seconds with no output.
          # Installing the extra is what makes the runner's dependency set match the one
          # the tests are written against.
          python -m pip install ".[test]"

      - name: Entry point resolves
        run: |
          python -c "import importlib.metadata as m; print('dsh-cua', m.version('dsh-cua'))"
          python -c "from dsh_cua.server import main; assert callable(main); print('main() ok')"
          # The console script must exist on PATH; --help would start the stdio server,
          # so only its presence is asserted.
          python -c "import shutil,sys; p=shutil.which('dsh-cua-server'); sys.exit(0 if p else 'dsh-cua-server not on PATH')"

      - name: Byte-compile every module
        run: python -m compileall -q src

      - name: Environment facts (diagnostic; never fails the job)
        shell: pwsh
        run: |
          # Every fact a runner-only failure needs to be explained, published where it can
          # be read from outside: the job summary is rendered on the public run page,
          # whereas the job log endpoint needs authentication (measured: 403 unauthenticated).
          $lines = @(
            "### environment facts",
            "",
            "| fact | value |",
            "| --- | --- |",
            "| python -V | $((python -V 2>&1) -join ' ') |",
            "| sys.executable | $(python -c 'import sys; print(sys.executable)') |",
            "| PyYAML module | $(python -c 'import importlib.util as u; s=u.find_spec("yaml"); print(s.origin if s else "MISSING")') |",
            "| pwsh version | $($PSVersionTable.PSVersion) |",
            "| pwsh path | $((Get-Command pwsh -ErrorAction SilentlyContinue).Source) |",
            "| runner image | $env:RUNNER_OS / $env:ImageOS |"
          )
          $lines | ForEach-Object { Write-Output $_ }
          if ($env:GITHUB_STEP_SUMMARY) {
            $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Workflow shell blocks parse
        run: python tests/check-workflow-shell.py

      - name: Desktop-free verification suite
        shell: pwsh
        run: |
          # Run the suite and publish its output on failure, through the two channels that
          # need no token: the job summary (full text, on the public run page) and check
          # annotations (via the public API). The job log itself is 403 unauthenticated, so
          # without this a red run is opaque from outside.
          #
          # Note on exit codes: GitHub runs a `shell: pwsh` step as
          # `pwsh -command ". '<temp>.ps1'"`, and in that shape every non-zero exit surfaces
          # as 1 (measured 2026-09-25 on PowerShell 7.6.6: exit 2 / exit 3 / cmd /c exit 5 /
          # sys.exit(7) all became 1, while -File kept the code). So `$code` below cannot be
          # trusted as a diagnosis — the output is the diagnosis, which is why it is published.
          python tests/ci-desktop-free.py *> ci-output.txt
          $code = $LASTEXITCODE
          Get-Content ci-output.txt | ForEach-Object { Write-Output $_ }

          if ($code -ne 0) {
            if ($env:GITHUB_STEP_SUMMARY) {
              "### ci-desktop-free: FAIL" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              "``````text" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              Get-Content ci-output.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              "``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            }
            $flat = (Get-Content ci-output.txt -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            $i = 0
            foreach ($m in [regex]::Matches($flat, '.{1,20000}')) {
              Write-Output "::error title=ci-output-$i::$($m.Value)"
              $i++
            }
            Write-Output ("::error title=ci-desktop-free::{0} annotation chunk(s) above; exit code {1}" -f $i, $code)
          }
          exit $code
