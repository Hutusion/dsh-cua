name: publish-registry

# Publishes server.json to the official MCP Registry, using GitHub Actions OIDC.
#
# Why this file exists. The registry is a separate directory from PyPI, and its record used to
# live OUTSIDE this repository, in a scratch folder — so nothing tied it to the code it
# describes. Measured 2026-09-25: the registry still advertised 0.3.1 while the repo and PyPI
# were already on 0.3.2. Keeping server.json here, next to pyproject.toml, and publishing it
# from CI is what makes that drift impossible instead of merely unlikely — the job below refuses
# to publish a record whose version disagrees with the package.
#
# `mcp-publisher login github-oidc` mints its credential from the workflow's own OIDC token, so
# — exactly like the PyPI side — no long-lived secret exists in the repository, on a runner, or
# on a developer machine. The CLI's other login mode is an interactive GitHub device flow, whose
# cached token was already expired by the time it was next needed (401 "token is expired").
# The registry authorises the OIDC token by matching its repository claim against the namespace
# in server.json's name: io.github.Hutusion/dsh-cua  <-  Hutusion/dsh-cua.
#
# Trigger: a published GitHub Release, plus manual dispatch. The manual path is what backfills a
# record that fell behind, and it is the reason this is a workflow of its own rather than a job
# inside publish.yml: a manual re-run of that one would attempt a duplicate PyPI upload, which
# PyPI refuses, and the registry job would then be skipped for the wrong reason.
#
# Being a separate workflow also means the two race: both fire on `release: published`, and this
# one finishes first. Measured on v0.3.3 — this job reached its publish step at 07:24:44, while
# publish.yml did not complete the PyPI upload until 07:25:34. The registry verifies that the
# version it is pointed at really exists, so it refused. Hence the wait below.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token IS the credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: server.json must describe the version in pyproject.toml
        run: |
          python - <<'PY'
          import json, pathlib, sys, tomllib

          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          record = json.loads(pathlib.Path("server.json").read_text())
          versions = {v for v in [record.get("version")] + [p.get("version") for p in record.get("packages", [])] if v}
          print(f"pyproject={declared}  server.json={sorted(versions)}")
          if versions != {declared}:
              sys.exit(f"::error title=registry drift::server.json describes {sorted(versions)} "
                       f"but the package is {declared}")
          PY

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          mkdir -p /tmp/mcp-publisher
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp/mcp-publisher
          # `ls` here on purpose: a renamed asset would otherwise fail two steps later with a
          # confusing "command not found".
          ls -l /tmp/mcp-publisher
          chmod +x /tmp/mcp-publisher/mcp-publisher
          /tmp/mcp-publisher/mcp-publisher --help | head -5

      - name: Validate the record against the registry schema
        run: /tmp/mcp-publisher/mcp-publisher validate ./server.json

      - name: Wait for that version to exist on PyPI
        run: |
          # The two publish workflows both trigger on `release: published` and run concurrently,
          # and this one is much faster (see the header). The registry refuses a record pointing at
          # a version that does not exist yet, so wait for it to land rather than lose the release.
          #
          # Ordering the workflows would fix the race too, but at the cost of making this one
          # unrunnable on its own — and being runnable on its own is the whole reason the manual
          # dispatch path exists.
          #
          # The condition is HTTP 200 AND info.version matching, not the status code alone:
          # pypi.org answers some paths with a 200 bot-challenge page (measured — /project/<name>/
          # <bogus>.md -> 200, 3038 bytes, not JSON), so a bare 200 could be a false green.
          # /pypi/<name>/<version>/json is not behind that wall and 404s honestly (measured —
          # /pypi/dsh-cua/9.9.9/json -> 404, 24 bytes).
          version="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          url="https://pypi.org/pypi/dsh-cua/$version/json"
          for attempt in $(seq 1 40); do
            if curl -fsS -o /tmp/pypi.json "$url" 2>/dev/null \
               && python -c "import json,sys; sys.exit(0 if json.load(open('/tmp/pypi.json'))['info']['version'] == '$version' else 1)"; then
              echo "::notice title=version is live::dsh-cua $version is on PyPI (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt/40: $url is not ready yet; waiting 15s"
            sleep 15
          done
          echo "::error title=version never appeared::dsh-cua $version is still not on PyPI after ~10 minutes — refusing to publish a registry record that points at a version which does not exist"
          exit 1

      - name: Authenticate with OIDC and publish
        run: |
          /tmp/mcp-publisher/mcp-publisher login github-oidc
          /tmp/mcp-publisher/mcp-publisher publish ./server.json
