name: publish

# Publishes the package to PyPI through Trusted Publishing (OIDC).
#
# Why this file exists. Until now "publish" meant running `uv publish` by hand from one
# machine with an API token sitting in a plaintext file. Measured 2026-09-25, that token was
# ACCOUNT-scoped: it could upload to every project on the account, not just this one, and it
# had to be created, stored and revoked by hand — the revocation itself went through PyPI's
# password gate twice. None of that is a property of this project; it is a property of
# token-based publishing.
#
# With Trusted Publishing there is no token anywhere. PyPI is configured once, on its side, to
# trust this repository + THIS workflow file + the `pypi` environment. GitHub then mints a
# short-lived OIDC token for the publishing job and PyPI exchanges it for an upload
# authorization valid for that single run. Nothing secret lives in the repo, on a runner, or
# on a developer machine — so there is no credential to leak, rotate or forget.
#
# Trigger: publishing a GitHub Release. Three gates sit in front of the upload, because a PyPI
# upload cannot be undone (a released file can be yanked but never replaced):
#
#   1. the source being built IS the tagged commit — `v<version>` must resolve to GITHUB_SHA
#      (plus, when the trigger is a release, the release tag must match pyproject's version),
#   2. pyproject.toml and dsh_cua.__version__ agree, and
#   3. the built WHEEL must install and answer `tools/list` on Linux — the exact property
#      directory crawlers (Glama and friends) gate their listings on, checked on the artifact
#      that is about to be uploaded rather than on the source tree.
#
# Setup, once: https://pypi.org/manage/account/publishing/ → "Add a new pending publisher"
# with PyPI Project Name `dsh-cua`, Owner `Hutusion`, Repository name `dsh-cua`,
# Workflow name `publish.yml`, Environment name `pypi`.

on:
  release:
    types: [published]
  # Kept for retries: if the release-triggered run fails for an infrastructure reason, this
  # lets the same commit be re-published without cutting a new release. Re-uploading an
  # already-released version is refused by PyPI, so a stray run is harmless.
  #
  # It must target the TAG, not a branch — `gh workflow run publish.yml --ref v0.3.2`. The
  # source-binding gate below refuses a dispatch whose commit is not the tagged commit, which
  # is what makes "the same commit" an enforced property rather than an assumption.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The source-binding gate below resolves the release tag, so the tag and the history
          # it points into must actually be present; the default shallow, tag-less checkout
          # would make that gate fail for the wrong reason.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The source being built must be the tagged commit
        shell: bash
        run: |
          # This replaces a check that only ran `if: github.event_name == 'release'` and only
          # compared tag/version NAMES. Two holes came out of that: a workflow_dispatch run
          # skipped the gate entirely and bound the build to nothing, and a lightweight tag
          # force-moved after the release would still pass while changing what gets built.
          # Asserting tag SHA == GITHUB_SHA closes both, and is the only thing in this file
          # that ties the artifact to a commit.
          version="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          tag="v$version"

          if [ "${{ github.event_name }}" = "release" ]; then
            released="${{ github.event.release.tag_name }}"
            echo "release tag=$released  pyproject version=$version"
            # Both `0.3.2` and `v0.3.2` are accepted; anything else is refused, because a
            # mismatched tag would burn a version number nobody intended to release.
            if [ "$released" != "$version" ] && [ "$released" != "$tag" ]; then
              echo "::error title=tag/version mismatch::release tag '$released' does not match pyproject version '$version'"
              exit 1
            fi
          fi

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error title=missing tag::pyproject says $version but this repository has no tag $tag"
            exit 1
          fi
          tag_sha="$(git rev-parse "$tag^{commit}")"
          echo "tag $tag -> $tag_sha"
          echo "GITHUB_SHA -> $GITHUB_SHA"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error title=untagged source::the commit being built ($GITHUB_SHA) is not the commit $tag points at ($tag_sha). To re-publish a version, dispatch on its tag: gh workflow run publish.yml --ref $tag"
            exit 1
          fi
          echo "::notice title=source bound to tag::$tag == $tag_sha"

      - name: pyproject and dsh_cua.__version__ must agree
        run: |
          python - <<'PY'
          import pathlib, re, sys, tomllib

          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          source = pathlib.Path("src/dsh_cua/__init__.py").read_text()
          match = re.search(r'__version__\s*=\s*"([^"]+)"', source)
          if not match:
              sys.exit("src/dsh_cua/__init__.py has no __version__ to compare")
          runtime = match.group(1)
          print(f"pyproject={declared}  dsh_cua.__version__={runtime}")
          # A drift here is invisible until someone compares the PyPI metadata against what
          # the server reports over MCP, which is exactly the kind of thing nobody checks.
          if declared != runtime:
              sys.exit(f"::error title=version drift::pyproject says {declared}, dsh_cua says {runtime}")
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: The wheel installs, and the server answers introspection on Linux
        shell: bash
        run: |
          # Run the repository's own regression test against the INSTALLED wheel, from /tmp so
          # the checkout's src/ cannot shadow the installed package. A wheel that cannot do
          # this is a wheel Glama will refuse to list, so it must not reach PyPI.
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --upgrade pip
          /tmp/wheelcheck/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheelcheck/bin/python "$GITHUB_WORKSPACE/tests/linux-handshake.py"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the "Environment name" on PyPI's pending-publisher form; it is also where a
    # required-reviewer rule would go if a human should approve each release.
    environment: pypi
    permissions:
      # The OIDC token IS the credential — without this the action has nothing to present.
      id-token: write
      # Reading the artifact from the build job.
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
